name: fixed-contract-tests
on:
  push:
    branches: [t05-lab, t05-session-b]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_contract_integrity.py tests/test_initialization.py -v
      - run: python scripts/run_tests.py --output evidence/ci-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-evidence
          path: evidence/ci-results.*
